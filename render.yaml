services:
  - type: web
    name: trendcommerce
    runtime: node
    region: singapore
    plan: free
    buildCommand: npm ci && npm --prefix client ci && npm --prefix client run build && npx prisma generate
    preDeployCommand: npm run migrate:deploy
    initialDeployHook: npm run seed
    startCommand: npm start
    healthCheckPath: /health
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        fromDatabase:
          name: trendcommerce-db
          property: connectionString
      - key: JWT_ACCESS_SECRET
        generateValue: true
      - key: JWT_REFRESH_SECRET
        generateValue: true
      - key: JWT_ACCESS_EXPIRY
        value: 15m
      - key: JWT_REFRESH_EXPIRY
        value: 30d
      - key: MAX_FILE_SIZE
        value: "10485760"
      - key: ALLOWED_MIME_TYPES
        value: image/jpeg,image/png,image/webp,image/gif,video/mp4
      - key: CLOUDINARY_CLOUD_NAME
        sync: false
      - key: CLOUDINARY_API_KEY
        sync: false
      - key: CLOUDINARY_API_SECRET
        sync: false
      - key: CLOUDINARY_FOLDER
        value: trendcommerce
      - key: CORS_ORIGIN
        sync: false

databases:
  - name: trendcommerce-db
    databaseName: trendcommerce
    user: trendcommerce
    region: singapore
    plan: free
